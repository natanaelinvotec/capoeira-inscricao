<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Capoeira Liberdade</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .cms-grid { display: grid; grid-template-columns: 250px 1fr; gap: 30px; margin-top: 20px; }
        .cms-btn { padding: 15px; background: white; border: 1px solid #ccc; border-radius: 10px; width: 100%; text-align: left; margin-bottom: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .cms-btn.active, .cms-btn:hover { background: var(--primary-teal); color: white; border-color: var(--primary-teal); }
        .cms-form { background: white; padding: 25px; border-radius: 15px; border: 1px solid #ccc; margin-bottom: 30px; display: grid; gap: 15px; }
        .item-list { display: grid; gap: 10px; }
        .item-card { background: white; padding: 15px; border-radius: 10px; border: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        textarea.input-padrao { resize: vertical; min-height: 80px; }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="logo-area"><span style="font-weight: 800; font-size: 1.2rem; color: var(--primary-blue);">Painel CMS - Gestão do Site</span></div>
        <a href="admin.html" class="nav-item"><i class="fas fa-arrow-left"></i> Voltar ao Painel Master</a>
    </header>

    <div class="main-layout" style="max-width: 1300px;">
        <div class="cms-grid">
            <aside>
                <button class="cms-btn active" onclick="mudarAbaCms('equipe')"><i class="fas fa-users"></i> Atletas e Equipe</button>
                <button class="cms-btn" onclick="mudarAbaCms('agenda')"><i class="fas fa-calendar"></i> Agenda / Mapas</button>
                <button class="cms-btn" onclick="mudarAbaCms('locais')"><i class="fas fa-map-marker-alt"></i> Locais de Treino</button>
                <button class="cms-btn" onclick="mudarAbaCms('loja')"><i class="fas fa-shopping-bag"></i> Loja Online</button>
            </aside>
            <main>
                <!-- ABA EQUIPE -->
                <section id="aba-equipe" class="aba-content active">
                    <h2>Adicionar Atleta / Professor</h2>
                    <form id="formEquipe" class="cms-form">
                        <input type="text" id="eqNome" class="input-padrao" placeholder="Nome do Atleta/Mestre" required>
                        <input type="text" id="eqTitulo" class="input-padrao" placeholder="Título (Ex: Skate, Capoeira)" required>
                        <input type="url" id="eqCover" class="input-padrao" placeholder="URL Imagem de Ação (Capa Fundo)" required>
                        <input type="url" id="eqImg" class="input-padrao" placeholder="URL Foto do Rosto (Avatar Redondo)" required>
                        <textarea id="eqBio" class="input-padrao" placeholder="Biografia" required></textarea>
                        <input type="text" id="eqWhats" class="input-padrao" placeholder="WhatsApp (Somente números 5567999999999)" required>
                        <button type="submit" class="btn-salvar-modal"><i class="fas fa-save"></i> Adicionar ao Site</button>
                    </form>
                    <div id="listaEquipe" class="item-list"></div>
                </section>

                <!-- ABA AGENDA -->
                <section id="aba-agenda" class="aba-content">
                    <h2>Adicionar Evento na Agenda</h2>
                    <form id="formAgenda" class="cms-form">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <input type="datetime-local" id="dataEvento" class="input-padrao" required>
                            <input type="text" id="tituloEvento" class="input-padrao" placeholder="Título (Ex: Roda de Rua)" required>
                        </div>
                        <input type="text" id="localEvento" class="input-padrao" placeholder="Endereço Completo para exibição textual" required>
                        <textarea id="iframeMapaEvento" class="input-padrao" placeholder="Cole aqui o link do Iframe (src) do Google Maps para exibir em Destaque" required></textarea>
                        <input type="url" id="linkMidiaEvento" class="input-padrao" placeholder="Link do Álbum de Fotos (Opcional - botão aparece quando concluir)">
                        <button type="submit" class="btn-salvar-modal"><i class="fas fa-save"></i> Salvar Evento</button>
                    </form>
                    <div id="listaAgenda" class="item-list"></div>
                </section>

                <!-- ABA LOCAIS -->
                <section id="aba-locais" class="aba-content">
                    <h2>Cadastrar Polo de Treinamento</h2>
                    <form id="formLocais" class="cms-form">
                        <input type="text" id="nomePolo" class="input-padrao" placeholder="Nome do Polo (Ex: Rancho Alegre)" required>
                        <input type="text" id="profPolo" class="input-padrao" placeholder="Professor Responsável" required>
                        <input type="text" id="diasPolo" class="input-padrao" placeholder="Dias e Horários (Ex: Seg/Qua - 19h)" required>
                        <input type="text" id="endPolo" class="input-padrao" placeholder="Endereço Físico" required>
                        <input type="url" id="linkMapsPolo" class="input-padrao" placeholder="URL do Google Maps do local" required>
                        <button type="submit" class="btn-salvar-modal"><i class="fas fa-save"></i> Adicionar Local</button>
                    </form>
                    <div id="listaLocais" class="item-list"></div>
                </section>
                
                <!-- ABA LOJA -->
                <section id="aba-loja" class="aba-content">
                    <h2>Adicionar Produto na Loja</h2>
                    <form id="formLoja" class="cms-form">
                        <input type="text" id="nomeProduto" class="input-padrao" placeholder="Nome do Produto" required>
                        <input type="text" id="precoProduto" class="input-padrao" placeholder="Preço (Ex: R$ 90,00)" required>
                        <input type="url" id="imgProduto" class="input-padrao" placeholder="URL da Imagem do Produto" required>
                        <button type="submit" class="btn-salvar-modal"><i class="fas fa-save"></i> Adicionar Produto</button>
                    </form>
                    <div id="listaLoja" class="item-list"></div>
                </section>
            </main>
        </div>
    </div>

    <script type="module" src="gerenciador-site.js"></script>
    <script>
        function mudarAbaCms(aba) {
            document.querySelectorAll('.aba-content, .cms-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`aba-${aba}`).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
