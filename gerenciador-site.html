<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Capoeira Liberdade</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .cms-grid { display: grid; grid-template-columns: 250px 1fr; gap: 30px; margin-top: 20px; }
        .cms-btn { padding: 15px; background: white; border: 1px solid #ccc; border-radius: 10px; width: 100%; text-align: left; margin-bottom: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .cms-btn.active, .cms-btn:hover { background: var(--primary-teal); color: white; border-color: var(--primary-teal); }
        .cms-form { background: white; padding: 25px; border-radius: 15px; border: 1px solid #ccc; margin-bottom: 30px; display: grid; gap: 15px; }
        .item-list { display: grid; gap: 10px; }
        .item-card { background: white; padding: 15px; border-radius: 10px; border: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="logo-area"><span style="font-weight: 800; font-size: 1.2rem; color: var(--primary-blue);">Painel CMS - Site Público</span></div>
        <a href="admin.html" class="nav-item">Voltar ao Painel Master</a>
    </header>

    <div class="main-layout" style="max-width: 1200px;">
        <div class="cms-grid">
            <aside>
                <button class="cms-btn active" onclick="mudarAbaCms('mestres')"><i class="fas fa-users"></i> Mestres</button>
                <button class="cms-btn" onclick="mudarAbaCms('agenda')"><i class="fas fa-calendar"></i> Agenda</button>
                <button class="cms-btn" onclick="mudarAbaCms('locais')"><i class="fas fa-map-marker-alt"></i> Locais</button>
                <button class="cms-btn" onclick="mudarAbaCms('loja')"><i class="fas fa-store"></i> Loja</button>
                <button class="cms-btn" onclick="mudarAbaCms('kids')"><i class="fas fa-child"></i> Kids Slider</button>
            </aside>
            <main>
                <!-- ABA AGENDA -->
                <section id="aba-agenda" class="aba-content active">
                    <h2>Adicionar Evento na Agenda</h2>
                    <form id="formAgenda" class="cms-form">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <input type="datetime-local" id="dataEvento" class="input-padrao" required>
                            <input type="text" id="tituloEvento" class="input-padrao" placeholder="Título (Ex: Roda de Rua)" required>
                        </div>
                        <input type="text" id="localEvento" class="input-padrao" placeholder="Endereço Completo" required>
                        <input type="url" id="linkMidiaEvento" class="input-padrao" placeholder="Link do Álbum de Fotos (Preencha após o evento)">
                        <button type="submit" class="btn-salvar-modal">Salvar Evento</button>
                    </form>
                    <div id="listaAgenda" class="item-list"></div>
                </section>

                <!-- ABA LOCAIS -->
                <section id="aba-locais" class="aba-content">
                    <h2>Cadastrar Nova Academia / Polo</h2>
                    <form id="formLocais" class="cms-form">
                        <input type="text" id="nomePolo" class="input-padrao" placeholder="Nome do Polo (Ex: Rancho Alegre)" required>
                        <input type="text" id="profPolo" class="input-padrao" placeholder="Professor Responsável" required>
                        <input type="text" id="diasPolo" class="input-padrao" placeholder="Dias e Horários (Ex: Seg/Qua - 19h)" required>
                        <input type="text" id="endPolo" class="input-padrao" placeholder="Rua, Número - Bairro" required>
                        <button type="submit" class="btn-salvar-modal">Adicionar Local</button>
                    </form>
                    <div id="listaLocais" class="item-list"></div>
                </section>
                
                <!-- ABA LOJA -->
                <section id="aba-loja" class="aba-content">
                    <h2>Adicionar Produto na Loja</h2>
                    <form id="formLoja" class="cms-form">
                        <input type="file" id="fotoProduto" accept="image/*" required>
                        <input type="text" id="nomeProduto" class="input-padrao" placeholder="Nome do Produto" required>
                        <input type="text" id="precoProduto" class="input-padrao" placeholder="Preço (Ex: R$ 90,00)" required>
                        <button type="submit" class="btn-salvar-modal">Adicionar Produto</button>
                    </form>
                </section>

                <section id="aba-mestres" class="aba-content"><p>Módulo de upload de Mestres ativo.</p></section>
                <section id="aba-kids" class="aba-content"><p>Módulo de fotos Kids ativo.</p></section>
            </main>
        </div>
    </div>

    <script type="module" src="gerenciador-site.js"></script>
    <script>
        function mudarAbaCms(aba) {
            document.querySelectorAll('.aba-content, .cms-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`aba-${aba}`).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
