<!-- inscricao.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Capoeira Liberdade</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-teal: #389E92; --primary-blue: #002D72; --bg-app: #EAF2F1; --text-dark: #2C3E50; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        body { background: linear-gradient(135deg, var(--primary-blue), var(--primary-teal)); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .inscricao-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 600px; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        h2 { color: var(--primary-blue); font-family: 'Montserrat', sans-serif; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--text-dark); font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; font-size: 0.95rem; background: #fafafa; }
        input:focus, select:focus { border-color: var(--primary-teal); background: #fff; }
        .btn-submit { width: 100%; padding: 14px; background: var(--primary-teal); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        .btn-submit:hover { background: var(--primary-blue); }
        .responsavel-box { background: #f4f7f6; padding: 15px; border-radius: 10px; border: 1px solid #e0e6e5; margin-top: 15px; display: none; }
        .voltar-login { text-align: center; margin-top: 15px; }
        .voltar-login a { color: var(--primary-blue); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="inscricao-container">
        <h2>Ficha de Inscrição / Cadastro</h2>
        <form id="formInscricao">
            <div class="form-group">
                <label>Nome Completo do Aluno</label>
                <input type="text" id="nomeAluno" required>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Idade</label>
                    <input type="number" id="idadeAluno" min="3" max="100" required>
                </div>
                <div class="form-group">
                    <label>Local de Treino (Academia)</label>
                    <select id="localTreino" required>
                        <option value="">Selecione...</option>
                        <option value="Mestre Profeta">Mestre Profeta</option>
                        <option value="Professora Taynara">Professora Taynara</option>
                        <option value="Mestre Abraão">Mestre Abraão</option>
                        <option value="Mestre Omar">Mestre Omar</option>
                        <option value="Mestre Carlinhos">Mestre Carlinhos</option>
                        <option value="Professor Maick">Professor Maick</option>
                        <option value="Professor Tigoy">Professor Tigoy</option>
                        <option value="Professor Rafinha">Professor Rafinha</option>
                        <option value="Instrutor Leiliano">Instrutor Leiliano</option>
                        <option value="Professor Lebrinha">Professor Lebrinha</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>E-mail (para login)</label>
                <input type="email" id="emailAluno">
            </div>
            <div class="form-group">
                <label>Celular / WhatsApp (para login)</label>
                <input type="text" id="celularAluno" placeholder="(00) 00000-0000">
            </div>
            <div class="form-group">
                <label>Senha de Acesso ao Painel</label>
                <input type="password" id="senhaAluno" required placeholder="Crie uma senha segura">
            </div>
            <div class="form-group">
                <label>Link da Foto de Perfil (Opcional)</label>
                <input type="url" id="fotoAluno" placeholder="https://exemplo.com/foto.jpg">
            </div>

            <!-- Bloco para Menor de Idade -->
            <div class="responsavel-box" id="boxResponsavel">
                <h4 style="color: var(--primary-blue); margin-bottom: 10px;"><i class="fas fa-shield-alt"></i> Dados do Responsável (Obrigatório para menores de 12 anos)</h4>
                <div class="form-group">
                    <label>Nome do Responsável</label>
                    <input type="text" id="nomeResponsavel">
                </div>
                <div class="form-group">
                    <label>E-mail ou Celular do Responsável (para login)</label>
                    <input type="text" id="identificadorResponsavel" placeholder="E-mail ou WhatsApp">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnSalvarInscricao">Concluir Inscrição</button>
        </form>
        <div class="voltar-login">
            <a href="login.html"><i class="fas fa-arrow-left"></i> Voltar para o Login</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const app = initializeApp({
          apiKey: "AIzaSyBkwCDziiV-Uh7MLzsy9OYJmA_LMnn7jbg",
          authDomain: "capoeira-liberdade.firebaseapp.com",
          projectId: "capoeira-liberdade",
          storageBucket: "capoeira-liberdade.firebasestorage.app",
          messagingSenderId: "492022804215",
          appId: "1:492022804215:web:c61aed556d9f1aa9576df2"
        });
        const db = getFirestore(app);

        const idadeInput = document.getElementById('idadeAluno');
        const boxResp = document.getElementById('boxResponsavel');

        idadeInput.addEventListener('input', () => {
            if(Number(idadeInput.value) < 12 && idadeInput.value !== "") {
                boxResp.style.display = 'block';
                document.getElementById('nomeResponsavel').required = true;
                document.getElementById('identificadorResponsavel').required = true;
            } else {
                boxResp.style.display = 'none';
                document.getElementById('nomeResponsavel').required = false;
                document.getElementById('identificadorResponsavel').required = false;
            }
        });

        document.getElementById('formInscricao').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvarInscricao');
            btn.innerHTML = 'Salvando...'; btn.disabled = true;

            const idade = Number(idadeInput.value);
            const dadosNovoAluno = {
                nome: document.getElementById('nomeAluno').value.trim(),
                idade: idade,
                localTreino: document.getElementById('localTreino').value,
                email: document.getElementById('emailAluno').value.trim().toLowerCase(),
                celular: document.getElementById('celularAluno').value.trim(),
                senha: document.getElementById('senhaAluno').value.trim(),
                fotoUrl: document.getElementById('fotoAluno').value.trim() || 'https://via.placeholder.com/150',
                cordaoAtual: 'Iniciante',
                statusAtivo: 'Ativo',
                notas: {},
                nomeResponsavel: idade < 12 ? document.getElementById('nomeResponsavel').value.trim() : '',
                identificadorResponsavel: idade < 12 ? document.getElementById('identificadorResponsavel').value.trim().toLowerCase() : '',
                dataCadastro: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, "alunos"), dadosNovoAluno);
                alert("Inscrição realizada com sucesso! Faça seu login.");
                window.location.href = 'login.html';
            } catch(err) {
                alert("Erro ao realizar inscrição.");
                btn.innerHTML = 'Concluir Inscrição'; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
